<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="688" cy="17" r="63" fill="#047857" opacity="0.19"/>
    <circle cx="847" cy="674" r="78" fill="#047857" opacity="0.09"/>
    <circle cx="875" cy="621" r="98" fill="#047857" opacity="0.18"/>
    <circle cx="1229" cy="-4" r="55" fill="#047857" opacity="0.14"/>
    <circle cx="409" cy="263" r="93" fill="#047857" opacity="0.20"/>
    <circle cx="466" cy="78" r="29" fill="#047857" opacity="0.18"/>
    <rect x="609" y="-21" width="75" height="78" rx="8" fill="#059669" opacity="0.12" transform="rotate(20, 946, 240)"/>
    <rect x="329" y="211" width="88" height="28" rx="8" fill="#059669" opacity="0.12" transform="rotate(30, 981, 114)"/>
    <rect x="1228" y="-96" width="70" height="47" rx="8" fill="#059669" opacity="0.12" transform="rotate(10, 1074, 614)"/>
    <rect x="363" y="523" width="47" height="66" rx="8" fill="#059669" opacity="0.12" transform="rotate(23, 46, 726)"/>
    <rect x="1100" y="673" width="76" height="86" rx="8" fill="#059669" opacity="0.07" transform="rotate(8, 146, 113)"/>
    <rect x="1130" y="558" width="63" height="53" rx="8" fill="#059669" opacity="0.13" transform="rotate(28, 1128, 267)"/>
    <rect x="5" y="645" width="64" height="88" rx="8" fill="#059669" opacity="0.03" transform="rotate(39, 630, 573)"/>
    <rect x="-34" y="276" width="92" height="69" rx="8" fill="#059669" opacity="0.11" transform="rotate(7, 1192, 427)"/>
    <polygon points="-65,-15 24,163 -154,163" fill="#047857" opacity="0.11"/>
    <polygon points="1122,-149 1201,9 1043,9" fill="#047857" opacity="0.10"/>
    <polygon points="368,422 456,598 280,598" fill="#047857" opacity="0.11"/>
    <polygon points="689,629 738,727 640,727" fill="#047857" opacity="0.11"/>

  <!-- Wave at bottom -->
  <path d="M0,534 C360,582 840,486 1200,534 L1200,630 L0,630Z" fill="#047857" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    백링크 대행 사이트
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 네트워크 보안
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#34d399" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#34d399" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 백링크 대행 사이트 — 네트워크 보안
  </text>
</svg>